<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Happy 20/10 ✨ Gửi Tiểu My</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Outfit:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">

  <!-- Modular Stylesheets (< 200 lines each) -->
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/animations.css">
</head>
<body>

  <!-- Floating Ambient Particles Canvas -->
  <canvas id="particle-canvas"></canvas>

  <!-- Audio Toggle Button -->
  <button id="audio-toggle" class="audio-toggle-btn" title="Bật/Tắt Nhạc Nền" aria-label="Bật hoặc tắt nhạc nền">
    <span style="font-size: 1.25rem;">🎵</span>
  </button>

  <main class="main-wrapper">
    <!-- Stage 1: Unboxing Gate -->
    <section id="unboxing-stage" class="unboxing-stage">
      <div class="pill-badge">✨ 20/10 For Tiểu My</div>
      <h1 class="title-primary">Gửi Tiểu My</h1>
      <p class="subtitle-cozy">Một góc nhỏ vui vẻ gửi về Đầm Dơi hôm nay...</p>
      
      <div id="gift-box" class="gift-box-container" onclick="unboxGift()">
        <svg class="gift-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="15" y="42" width="70" height="48" rx="8" fill="#e11d48"/>
          <rect x="10" y="32" width="80" height="15" rx="5" fill="#f43f5e"/>
          <rect x="44" y="32" width="12" height="58" fill="#f59e0b"/>
          <path d="M50 32C42 18 20 22 36 32C24 32 30 14 50 32Z" fill="#fbbf24"/>
          <path d="M50 32C58 18 80 22 64 32C76 32 70 14 50 32Z" fill="#f59e0b"/>
          <circle cx="50" cy="32" r="4.5" fill="#d97706"/>
        </svg>
      </div>

      <button class="btn-primary" onclick="unboxGift()">
        <span>Mở xem có gì nè ✨</span>
      </button>
    </section>

    <!-- Stage 2: Main Interactive Content -->
    <section id="content-stage" class="content-stage">
      <header style="text-align: center; margin-bottom: 24px;">
        <span class="pill-badge">🌸 20/10 Chill Vibes</span>
        <h1 class="title-primary shimmer-text">Happy 20/10, Tiểu My!</h1>
        <p class="subtitle-cozy">Nạp chút năng lượng sau ngày làm việc bận rộn</p>
      </header>

      <!-- The Handwritten Letter -->
      <article class="glass-panel">
        <div class="letter-box">
          <div class="letter-text" id="letter-content"></div>
          <span class="cursor-blink"></span>
          <div id="letter-signature" class="letter-signature" style="display: none;">
            - Lịnh
          </div>
        </div>
      </article>

      <!-- Special Vouchers Section -->
      <section style="margin: 28px 0;">
        <div style="text-align: center; margin-bottom: 16px;">
          <h2 style="font-family: var(--font-heading); color: var(--primary); font-size: 1.5rem;">
            Bộ 4 Voucher Vui Vẻ 20/10 🎟️
          </h2>
          <p style="font-size: 0.85rem; color: var(--text-muted);">Chạm vào từng thẻ để lật xem quyền lợi nghen</p>
        </div>
        <div id="vouchers-container" class="vouchers-grid"></div>
      </section>

      <!-- Heart Button Only -->
      <section style="text-align: center; margin: 24px 0;">
        <button class="btn-primary" onclick="sendHeart(event)" style="max-width: 280px;">
          <span>💖 Thả tim nạp năng lượng</span>
        </button>
        <div id="heart-counter" style="font-size: 0.85rem; color: var(--primary); font-weight: 600; margin-top: 8px;">
        </div>
      </section>

      <footer style="text-align: center; margin-top: 20px; font-size: 0.8rem; color: var(--text-muted);">
        Made with 💖 by Lịnh • 20/10/2026
      </footer>
    </section>
  </main>

  <div id="toast" class="toast-msg"></div>

  <!-- Main ES Module Script -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
